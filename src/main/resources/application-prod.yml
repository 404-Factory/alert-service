spring:
  config:
    activate:
      on-profile: prod

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false
    generate-ddl: false

  datasource:
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
      validation-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: never

server:
  shutdown: graceful

logging:
  level:
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql: OFF